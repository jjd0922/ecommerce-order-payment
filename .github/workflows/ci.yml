name: CI

on:
  push:
    branches:
      - main
      - 'PR/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            order-api/build/reports/jacoco/test/jacocoTestReport.xml
            order-application/build/reports/jacoco/test/jacocoTestReport.xml
            order-domain/build/reports/jacoco/test/jacocoTestReport.xml
            order-infrastructure/build/reports/jacoco/test/jacocoTestReport.xml
